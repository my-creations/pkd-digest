name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Format + Lint + Test + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: E2E tests
        run: bun run test:e2e

      - name: Build
        run: bun run build

      - name: Serve built site for link check
        run: |
          (bunx eleventy --serve --port=8901 >/tmp/eleventy-serve.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8901/pkd-digest/ >/dev/null && break
            sleep 2
          done

      # Elsevier (ajkd.org) blocks bots with 403; that source is verified at curation time.
      # Remap absolute production URLs to the local build so staged-but-undeployed
      # pages (e.g. feed.xml autodiscovery) resolve instead of 404ing on prod.
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose --no-progress --max-retries 3 --timeout 20
            --exclude-loopback=false --exclude 'https://www\.ajkd\.org/.*'
            --remap 'https://my-creations\.github\.io/pkd-digest http://127.0.0.1:8901/pkd-digest'
            http://127.0.0.1:8901/pkd-digest/
            http://127.0.0.1:8901/pkd-digest/digest/
            http://127.0.0.1:8901/pkd-digest/pt/digest/
            http://127.0.0.1:8901/pkd-digest/timeline/
            http://127.0.0.1:8901/pkd-digest/pt/timeline/
            http://127.0.0.1:8901/pkd-digest/feed.xml
            http://127.0.0.1:8901/pkd-digest/pt/feed.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Chrome
        # Pinned: latest branch as of 2026-09-15 (Release v2.2.0). Re-pin deliberately, never float.
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

      - name: Lighthouse CI
        run: bun run test:lighthouse
