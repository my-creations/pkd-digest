name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    name: Format + Lint + Test + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: E2E tests
        run: bun run test:e2e

      - name: Build
        run: bun run build

      - name: Serve built site for link check
        run: |
          (bunx eleventy --serve --port=8901 >/tmp/eleventy-serve.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8901/pkd-digest/ >/dev/null && break
            sleep 2
          done

      # Elsevier (ajkd.org) blocks bots with 403; that source is verified at curation time.
      # Remap absolute production URLs to the local build so staged-but-undeployed
      # pages (e.g. feed.xml autodiscovery) resolve instead of 404ing on prod.
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress --max-retries 3 --timeout 20
            --exclude-loopback=false --exclude 'https://www\.ajkd\.org/.*'
            --remap 'https://my-creations\.github\.io/pkd-digest http://127.0.0.1:8901/pkd-digest'
            http://127.0.0.1:8901/pkd-digest/
            http://127.0.0.1:8901/pkd-digest/digest/
            http://127.0.0.1:8901/pkd-digest/pt/digest/
            http://127.0.0.1:8901/pkd-digest/timeline/
            http://127.0.0.1:8901/pkd-digest/pt/timeline/
            http://127.0.0.1:8901/pkd-digest/feed.xml
            http://127.0.0.1:8901/pkd-digest/pt/feed.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Lighthouse CI
        run: bun run test:lighthouse
